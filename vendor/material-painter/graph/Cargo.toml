[package]
name = "material-painter-graph"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
half = "2.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "tga", "hdr", "exr"] }
serde_json = "1"
# Native graph and Bevy shader compilation run on separate threads.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
