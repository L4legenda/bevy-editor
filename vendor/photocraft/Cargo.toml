[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.23.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/photocraft"

[workspace.dependencies]
photocraft-geom = { path = "crates/geom" }
photocraft-cms = { path = "crates/cms" }
photocraft-color = { path = "crates/color" }
photocraft-raster = { path = "crates/raster" }
photocraft-doc = { path = "crates/doc" }
craft-pcraft-format = { path = "crates/pcraft-format" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
rustc-hash = "2.1.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
