[package]
name = "bevy-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A lightweight, configurable 3D level editor for Bevy"
repository = "https://github.com/L4legenda/bevy-editor"
publish = false
default-run = "bevy-editor"

[features]
default = ["editor", "mcp"]
mcp = ["editor", "dep:rmcp", "dep:tokio", "dep:axum", "dep:uuid", "dep:base64"]
lighting = [
    "dep:image",
    "dep:half",
    "bevy/bevy_light",
    "bevy/bevy_pbr",
    "bevy/tonemapping_luts",
    "bevy/area_light_luts",
    "bevy/zstd_rust",
    "bevy/ktx2",
]
editor = [
    "lighting",
    "dep:image",
    "dep:resvg",
    "dep:winit",
    "dep:reqwest",
    "dep:zip",
    "dep:photocraft-geom",
    "dep:photocraft-color",
    "dep:photocraft-raster",
    "dep:photocraft-doc",
    "dep:photocraft-paint",
    "dep:photocraft-format",
    "bevy/3d_bevy_render",
    "bevy/bevy_winit",
    "bevy/default_app",
    "bevy/jpeg",
    "bevy/keyboard",
    "bevy/mouse",
    "bevy/multi_threaded",
    "bevy/ui",
    "bevy/x11",
]

[[bin]]
name = "bevy-editor"
path = "src/main.rs"
required-features = ["editor"]
test = false

[[bin]]
name = "bevy-editor-mcp"
path = "src/bin/bevy-editor-mcp.rs"
required-features = ["mcp"]

[dependencies]
photocraft-geom = { path = "vendor/photocraft/crates/geom", optional = true }
photocraft-color = { path = "vendor/photocraft/crates/color", optional = true }
photocraft-raster = { path = "vendor/photocraft/crates/raster", optional = true }
photocraft-doc = { path = "vendor/photocraft/crates/doc", optional = true }
photocraft-paint = { path = "vendor/photocraft/crates/paint", optional = true }
photocraft-format = { path = "vendor/photocraft/crates/format", optional = true }
bevy = { version = "0.20.1", default-features = false, features = ["bevy_world_serialization"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tga", "webp", "hdr", "exr"] }
half = { version = "2.7", optional = true }
# HTTPS catalog/download workers and ambientCG's compressed environment packages.
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["blocking", "json", "rustls"] }
zip = { version = "9.5", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
resvg = { version = "0.49.0", optional = true, default-features = false }
winit = { version = "0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.10.0", optional = true, default-features = false, features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "io-std", "sync", "time", "macros"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
uuid = { version = "1", optional = true, features = ["v4"] }
base64 = { version = "0.22", optional = true }

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev]
opt-level = 1
debug = 0
incremental = false
