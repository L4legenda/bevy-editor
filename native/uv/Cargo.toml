[package]
name = "bevy-uv-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[build-dependencies]
bevy-uv-build = { path = "../uv-build" }

[profile.release]
debug = 0
opt-level = 2
