[package]
name = "bevy-cargo-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Keep the launcher independent of Bevy and its build lock/dependencies.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
