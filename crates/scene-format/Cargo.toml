[package]
name = "bevy-scene-format"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Versioned authoring scenes and checked, indexed runtime scene data"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
lz4_flex = "0.14"
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = 0
lto = "thin"
